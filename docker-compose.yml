version: "3.8"
services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    command: ["npx","vite","preview","--host","0.0.0.0","--port","3000"]

  dev:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: ["npm","run","dev","--","--host","0.0.0.0","--port","5173"]
